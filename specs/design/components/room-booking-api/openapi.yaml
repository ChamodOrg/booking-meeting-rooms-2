openapi: 3.0.3
info:
  title: Room Booking API
  version: 0.1.0
  description: "Rooms, free-room search, busy times, and the signed-in Member's own bookings."
servers:
  - url: /
security:
  - oauth2: []
paths:
  /rooms:
    get:
      operationId: listRooms
      summary: "Every room, alphabetical; with date, startTime and endTime only rooms free for that whole range; minCapacity keeps rooms that hold at least that many"
      security:
        - oauth2: [rooms:read]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date }, description: "Day to search, office local time" }
        - { name: startTime, in: query, required: false, schema: { type: string }, description: "HH:MM; required with date and endTime" }
        - { name: endTime, in: query, required: false, schema: { type: string }, description: "HH:MM, after startTime" }
        - { name: minCapacity, in: query, required: false, schema: { type: integer, minimum: 1 }, description: "Smallest group the room must hold" }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "The matching rooms"
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: "total matching rooms" }
                  next: { type: string, nullable: true, description: "relative URI of the next page" }
                  previous: { type: string, nullable: true, description: "relative URI of the previous page" }
                  data: { type: array, items: { $ref: '#/components/schemas/Room' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rooms/{roomId}:
    get:
      operationId: getRoom
      summary: "One room"
      security:
        - oauth2: [rooms:read]
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: "The room"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/busy-times:
    get:
      operationId: listRoomBusyTimes
      summary: "When a room is booked on one day, earliest first; never says who booked it"
      security:
        - oauth2: [rooms:read]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: "Day, office local time" }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "The busy ranges on that day"
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: "total busy ranges" }
                  next: { type: string, nullable: true, description: "relative URI of the next page" }
                  previous: { type: string, nullable: true, description: "relative URI of the previous page" }
                  data: { type: array, items: { $ref: '#/components/schemas/BusyTime' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/bookings:
    get:
      operationId: listMyBookings
      summary: "The caller's bookings: upcoming first, soonest at the top, then past ones, most recent first"
      security:
        - oauth2: [bookings:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "The caller's bookings, each with its room's name"
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: "total bookings the caller holds" }
                  next: { type: string, nullable: true, description: "relative URI of the next page" }
                  previous: { type: string, nullable: true, description: "relative URI of the previous page" }
                  data: { type: array, items: { $ref: '#/components/schemas/Booking' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMyBooking
      summary: "Book a room as the caller; refused with a reason when it clashes, exceeds capacity, starts in the past or is a third upcoming booking"
      security:
        - oauth2: [bookings:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: "The booking was made"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Refused: the room is already booked in that range, or the caller already holds two upcoming bookings; the message says which. Nothing is reserved"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings/{bookingId}:
    delete:
      operationId: cancelMyBooking
      summary: "Cancel one of the caller's own bookings, removing it; another Member's booking is 404"
      security:
        - oauth2: [bookings:cancel]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string }, description: "Booking id" }
      responses:
        '204':
          description: "The booking is removed and the room is free again"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Refused: the booking has already started and cannot be cancelled"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            rooms:read: "Every room, a search for free rooms, and busy times"
            bookings:read: "The caller's own bookings"
            bookings:create: "Book a room as the caller"
            bookings:cancel: "Cancel one of the caller's own bookings"
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string }
      description: "Room id"
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: "Page size"
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0, minimum: 0 }
      description: "Items to skip"
  responses:
    BadRequest:
      description: "Invalid input: past start, end not after start, different days, attendees below 1 or above the room's capacity; the message says which"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: "Not signed in, or the token lacks the permission"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: "No such room, or no such booking of the caller's"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Room:
      type: object
      required: [id, name, capacity, location]
      properties:
        id: { type: string }
        name: { type: string, description: "unique across the office" }
        capacity: { type: integer, description: "most people the room holds" }
        location: { type: string }
    BusyTime:
      type: object
      required: [date, startTime, endTime]
      properties:
        date: { type: string, format: date }
        startTime: { type: string, description: "HH:MM, office local time" }
        endTime: { type: string, description: "HH:MM, office local time" }
    BookingRequest:
      type: object
      required: [roomId, date, startTime, endTime, attendees]
      properties:
        roomId: { type: string }
        date: { type: string, format: date, description: "Single day, office local time" }
        startTime: { type: string, description: "HH:MM, not in the past" }
        endTime: { type: string, description: "HH:MM, after startTime on the same date" }
        attendees: { type: integer, minimum: 1, description: "At most the room's capacity" }
    Booking:
      type: object
      required: [id, roomId, roomName, date, startTime, endTime, attendees, status]
      properties:
        id: { type: string }
        roomId: { type: string }
        roomName: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, description: "HH:MM, office local time" }
        endTime: { type: string, description: "HH:MM, office local time" }
        attendees: { type: integer }
        status: { type: string, enum: [upcoming, past], description: "past once the booking has started; past bookings cannot be cancelled" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: "HTTP or application error code" }
        message: { type: string, description: "short human-readable label" }
        description: { type: string, description: "detailed explanation" }
        moreInfo: { type: string, description: "URI to documentation" }
