apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: room-booking-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  resources:
    - ref: booking-meeting-r-08841cd1
      envBindings:
        dbname: BOOKING_DB_DBNAME
        host: BOOKING_DB_HOST
        password: BOOKING_DB_PASSWORD
        port: BOOKING_DB_PORT
        user: BOOKING_DB_USER
    - ref: booking-meeting-r-2d5e8f17
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
